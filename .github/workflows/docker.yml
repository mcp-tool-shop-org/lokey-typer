# Publish the self-hosted web app image to GitHub Container Registry.
#
# ghcr.io/mcp-tool-shop-org/lokey-typer:<version> and :latest, built from the
# release tag. Release-only and manual: no push cost.
#
# The image holds no user data. Progress lives in each browser's storage for
# the address it was opened at, so replacing the container keeps it.
#
# Undo: delete the version under Packages > lokey-typer on GitHub
#       (gh api -X DELETE /orgs/mcp-tool-shop-org/packages/container/lokey-typer/versions/<id>),
#       then re-run this workflow for the previous tag to move :latest back.

name: Docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (for example v2.0.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then echo "Tag $TAG does not match package.json $version"; exit 1; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/mcp-tool-shop-org/lokey-typer:${{ env.VERSION }}
            ghcr.io/mcp-tool-shop-org/lokey-typer:latest
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
