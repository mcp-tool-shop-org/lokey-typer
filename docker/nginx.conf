server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Relative redirects: the published host port is not the container's 8080.
    absolute_redirect off;

    # The app lives under /lokey-typer/, the same base path as GitHub Pages.
    location = / { return 302 /lokey-typer/; }

    # The service worker and the app shell must be re-checked, so an upgraded
    # image reaches the browser on the next visit.
    location = /lokey-typer/sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /lokey-typer/index.html { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Hashed build assets and audio never change under the same name.
    location /lokey-typer/assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location /lokey-typer/audio/ { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }

    location /lokey-typer/handbook/ { try_files $uri $uri/ $uri.html =404; }

    # Everything else under the app falls back to the app shell.
    location /lokey-typer/ { try_files $uri $uri/ /lokey-typer/index.html; }
}
